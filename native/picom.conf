# SkidUX compositor avoids heavy shader blur on low-end GPUs.
backend = "xrender";
vsync = false;
shadow = true;
shadow-radius = 11;
shadow-opacity = 0.30;
shadow-offset-x = -5;
shadow-offset-y = -4;
fading = true;
fade-delta = 10;
inactive-opacity = 1.0;
active-opacity = 1.0;
detect-client-opacity = true;
detect-rounded-corners = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
unredir-if-possible = false;
