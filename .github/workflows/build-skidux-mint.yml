name: Build SkidUX Linux Mint Live ISO
on:
  push:
    branches: [skidux-linuxmint]
  workflow_dispatch:
concurrency:
  group: skidux-linuxmint-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  remaster:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Preflight SkidUX source, brand asset and build scripts
        run: |
          set -euo pipefail
          bash -n build-skidux-mint.sh
          bash -n skidux-system-overhaul.sh
          bash -n skidux-patch-initrd.sh
          python3 -m py_compile skidux-app.py
          python3 - <<'PY'
          import base64,pathlib,hashlib
          p=pathlib.Path("assets/official-skidux-logo.jpg.b64")
          b=base64.b64decode(p.read_text().strip(),validate=True)
          assert b.startswith(bytes.fromhex("ffd8")), "Missing JPEG SOI"
          assert b.endswith(bytes.fromhex("ffd9")), "Missing JPEG EOI"
          assert hashlib.sha256(b).hexdigest() == "bf09c35eb8cecdb39f785a1d205241869ea95a6ee9b5244c2346806f943c6a51", "SkidUX logo bytes differ from uploaded master"
          print("SkidUX official logo validated:",len(b),"bytes")
          PY
      - name: Free disk space for Linux Mint image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache /usr/local/share/powershell /usr/local/.ghcup || true
          sudo apt-get clean
          df -h .
      - name: Build complete Linux Mint-based SkidUX live ISO
        run: bash build-skidux-mint.sh
      - name: Boot ISO in QEMU and capture screen
        continue-on-error: true
        run: bash test-boot.sh dist/SkidUX_LinuxMint_LIVE_amd64.iso
      - name: Upload boot-test screen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SkidUX-Mint-VM-Boot-Evidence
          path: |
            dist/boot-test/screen.ppm
            dist/boot-test/serial.log
            dist/boot-test/qemu.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload ISO and verification details
        uses: actions/upload-artifact@v4
        with:
          name: SkidUX-LinuxMint-LIVE-ISO
          path: |
            dist/SkidUX_LinuxMint_LIVE_amd64.iso
            dist/SkidUX_LinuxMint_LIVE_amd64.iso.sha256
            dist/BOOT-REPORT.txt
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
